# Render Blueprint: runs the recruitment portal straight from this GitHub repository.
# Step-by-step instructions: HOSTING.md
services:
  - type: web
    name: recruitment-portal
    runtime: node
    # A paid plan is required: free services have no persistent disk (applications
    # and CVs would be wiped on every restart) and go to sleep when idle.
    plan: starter
    # Where the data is stored. This can't be changed after creation.
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node src/server.js
    healthCheckPath: /healthz
    autoDeploy: true
    disk:
      name: recruitment-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: HOST
        value: 0.0.0.0
      - key: TRUST_PROXY
        value: "1"
      - key: DATA_DIR
        value: /var/data
      # Random secrets generated by Render. Copy DATA_ENCRYPTION_KEY into your
      # password manager: without it the stored applications can't be read.
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SETUP_CODE
        generateValue: true
      # Asked for when you create the Blueprint.
      - key: COMPANY_NAME
        sync: false
      - key: PRIVACY_CONTACT_EMAIL
        sync: false
      - key: PUBLIC_BASE_URL
        sync: false
